name: priority_ring
description: High-reliability emergency bypass for parents.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # High-reliability alarm bypass
  alarm: ^5.2.1
  # System-level notifications
  flutter_local_notifications: ^20.0.0
  # Firebase
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  # Local storage for priority contacts
  shared_preferences: ^2.2.2
  # Correct time-zone handling for global silos
  timezone: ^0.10.1
  # Permission handling
  permission_handler: ^11.3.0
  # Localization
  intl: ^0.19.0
  # Icon support
  cupertino_icons: ^1.0.6
  http: ^1.6.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/night_soft.mp3
    - assets/audio/school_warning.wav
    - assets/audio/calm_emergency.mp3
    - assets/audio/emergency_siren.wav
