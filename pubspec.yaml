name: priority_ring
description: High-reliability emergency bypass for parents.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # High-reliability alarm bypass
  alarm: ^4.0.0
  # System-level notifications
  flutter_local_notifications: ^17.0.0
  # Correct time-zone handling for global silos
  timezone: ^0.9.0
  # Icon support
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
